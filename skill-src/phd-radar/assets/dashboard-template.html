<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PhD Radar · 推荐项目</title>
  <style>
    :root {
      --bg: #f4f7f8;
      --surface: #ffffff;
      --surface-muted: #edf3f4;
      --text: #122326;
      --muted: #617479;
      --line: #d7e1e3;
      --accent: #087f8c;
      --accent-strong: #05626c;
      --accent-soft: #dff3f4;
      --good: #13735b;
      --warn: #98600d;
      --danger: #a53a3a;
      --shadow: 0 18px 50px rgba(31, 65, 70, 0.08);
      --radius: 16px;
      --max: 1440px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(8, 127, 140, 0.28);
      outline-offset: 2px;
    }

    .shell { max-width: var(--max); margin: 0 auto; padding: 28px 32px 72px; }
    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding: 16px 0 26px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow { margin: 0 0 8px; color: var(--accent-strong); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 760px; font-size: clamp(30px, 4vw, 54px); line-height: 1.04; letter-spacing: -.045em; }
    .subtitle { margin: 14px 0 0; max-width: 780px; color: var(--muted); font-size: 15px; }
    .run-meta { text-align: right; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .run-meta strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 15px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin: 22px 0;
    }
    .stat { min-height: 106px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .stat .value { display: block; font-size: 29px; font-weight: 760; letter-spacing: -.035em; }
    .stat .label { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .stat.accent { background: var(--accent); border-color: var(--accent); color: white; }
    .stat.accent .label { color: rgba(255,255,255,.76); }

    .workspace { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; }
    .filters {
      position: sticky;
      top: 16px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .filters h2 { margin: 0 0 16px; font-size: 15px; }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .field input, .field select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .filter-note { margin: 15px 0 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .reset {
      width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 10px;
      color: var(--accent-strong); background: var(--surface); cursor: pointer; font-weight: 700;
    }
    .reset:active, .action:active, .evidence-toggle:active { transform: translateY(1px); }

    .results-head { display: flex; justify-content: space-between; gap: 18px; align-items: center; margin-bottom: 12px; }
    .results-head h2 { margin: 0; font-size: 17px; }
    .results-count { color: var(--muted); font-size: 13px; }
    .cards { display: grid; gap: 14px; }
    .card {
      position: relative;
      overflow: hidden;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--accent); }
    .card-top { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 17px; align-items: start; }
    .score {
      display: grid; place-items: center; width: 74px; height: 74px;
      background: var(--accent-soft); color: var(--accent-strong); border-radius: 14px;
    }
    .score strong { display: block; font-size: 25px; line-height: 1; letter-spacing: -.04em; }
    .score span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; text-align: center; }
    .rankline { margin: 0 0 7px; color: var(--accent-strong); font-size: 12px; font-weight: 800; letter-spacing: .05em; }
    .card h3 { margin: 0; font-size: clamp(18px, 2vw, 24px); line-height: 1.2; letter-spacing: -.025em; }
    .institution { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 16px 0; }
    .chip { padding: 5px 9px; background: var(--surface-muted); border-radius: 999px; color: var(--muted); font-size: 11px; }
    .chip.verified { color: var(--good); background: #e3f3ed; }
    .chip.warning { color: var(--warn); background: #fff0d8; }
    .card-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); gap: 20px; padding-top: 15px; border-top: 1px solid var(--line); }
    .recommendation { margin: 0; color: #33494d; font-size: 14px; }
    .pi-panel { padding: 14px; background: var(--bg); border-radius: 12px; }
    .pi-label { margin: 0 0 5px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .pi-name { margin: 0; font-size: 15px; font-weight: 760; }
    .pi-summary { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .screening { display: grid; grid-template-columns: minmax(210px, .75fr) minmax(0, 1.25fr); gap: 12px; margin-top: 14px; }
    .screen-panel { padding: 13px 14px; background: var(--surface-muted); border: 1px solid var(--line); border-radius: 12px; }
    .screen-title { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 9px; font-size: 11px; font-weight: 800; }
    .screen-state { color: var(--accent-strong); }
    .screen-facts { display: flex; flex-wrap: wrap; gap: 6px; }
    .screen-fact { padding: 5px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 10px; }
    .screen-fact strong { color: var(--ink); }

    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
    .action, .evidence-toggle {
      display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 9px 13px;
      border-radius: 10px; text-decoration: none; font-size: 12px; font-weight: 740; cursor: pointer;
    }
    .action.primary { background: var(--accent); color: white; border: 1px solid var(--accent); }
    .action.secondary, .evidence-toggle { background: var(--surface); color: var(--accent-strong); border: 1px solid var(--line); }
    .action[aria-disabled="true"] { opacity: .45; pointer-events: none; }
    .evidence-toggle { margin-left: auto; }
    .evidence { display: none; margin-top: 14px; padding: 14px; background: var(--bg); border-radius: 12px; }
    .evidence.open { display: block; }
    .evidence dl { display: grid; grid-template-columns: 130px 1fr; gap: 7px 12px; margin: 0; font-size: 12px; }
    .evidence dt { color: var(--muted); }
    .evidence dd { margin: 0; overflow-wrap: anywhere; }

    .empty { padding: 54px 24px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .empty h3 { margin: 0 0 8px; }
    .empty p { margin: 0; color: var(--muted); }
    .footer { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }

    @media (max-width: 1000px) {
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .workspace { grid-template-columns: 1fr; }
      .filters { position: static; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
      .filters h2, .filter-note, .reset { grid-column: 1 / -1; }
      .field { margin: 0; }
    }
    @media (max-width: 720px) {
      .shell { padding: 18px 15px 46px; }
      .masthead { grid-template-columns: 1fr; }
      .run-meta { text-align: left; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { padding: 18px; }
      .card-top { grid-template-columns: 58px minmax(0, 1fr); }
      .score { width: 58px; height: 58px; }
      .score strong { font-size: 20px; }
      .card-grid { grid-template-columns: 1fr; }
      .screening { grid-template-columns: 1fr; }
      .evidence-toggle { margin-left: 0; }
      .evidence dl { grid-template-columns: 1fr; }
      .evidence dd { margin-bottom: 7px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e181a; --surface: #142225; --surface-muted: #1b2d31; --text: #e7f0f1;
        --muted: #9bb0b4; --line: #2a3d41; --accent: #32a8b4; --accent-strong: #75d2da;
        --accent-soft: #17363b; --shadow: 0 18px 50px rgba(0,0,0,.2);
      }
      .recommendation { color: #c3d2d4; }
      .chip.verified { background: #183a31; }
      .chip.warning { background: #3b2c14; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">PhD Radar / Verified opportunities</p>
        <h1 id="dashboard-title">博士机会推荐</h1>
        <p class="subtitle" id="dashboard-subtitle"></p>
      </div>
      <div class="run-meta"><strong id="run-date"></strong><span id="coverage-label"></span></div>
    </header>

    <section class="stats" id="stats" aria-label="搜索统计"></section>

    <div class="workspace">
      <aside class="filters" aria-label="结果筛选">
        <h2>筛选推荐项目</h2>
        <div class="field"><label for="query">搜索</label><input id="query" type="search" placeholder="项目、大学或 PI"></div>
        <div class="field"><label for="country">地区</label><select id="country"><option value="">全部地区</option></select></div>
        <div class="field"><label for="min-score">最低分</label><select id="min-score"><option value="0">不限</option><option value="9">9.0+</option><option value="8">8.0+</option><option value="7">7.0+</option><option value="6">6.0+</option></select></div>
        <div class="field"><label for="qs-screen">QS 筛选</label><select id="qs-screen"><option value="">全部状态</option><option value="preferred">学科优选</option><option value="pass">门槛通过</option><option value="manual_review">人工复核</option></select></div>
        <div class="field"><label for="lab-screen">课题组核验</label><select id="lab-screen"><option value="">全部状态</option><option value="strong">证据强</option><option value="adequate">证据充分</option><option value="weak">证据弱</option><option value="incomplete">待补充</option></select></div>
        <button class="reset" id="reset" type="button">重置筛选</button>
        <p class="filter-note">仅展示经过官方页面核验的正式机会。排序使用未舍入综合分，显示值保留一位小数。</p>
      </aside>

      <section class="results" aria-live="polite">
        <div class="results-head"><h2>推荐项目</h2><span class="results-count" id="results-count"></span></div>
        <div class="cards" id="cards"></div>
      </section>
    </div>
    <footer class="footer" id="footer"></footer>
  </main>

  <script id="dashboard-data" type="application/json">__PHD_RADAR_DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById('dashboard-data').textContent);
    const results = Array.isArray(data.results) ? data.results : [];
    const summary = data.summary || {};
    const meta = data.meta || {};
    const esc = (v = '') => String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const safeUrl = (v) => /^https?:\/\//i.test(v || '') ? v : '';
    const score = (item, key) => Number(item[key] ?? item[key + '_raw'] ?? 0).toFixed(1);
    const fieldStatus = (item, name) => (item.field_evidence || []).find(x => x.field === name)?.status || 'unknown';

    document.getElementById('dashboard-title').textContent = meta.title || '博士机会推荐';
    document.getElementById('dashboard-subtitle').textContent = meta.subtitle || '按综合推荐度排序的已核验博士机会';
    document.getElementById('run-date').textContent = meta.generated_at ? `生成于 ${meta.generated_at}` : '最新结果';
    document.getElementById('coverage-label').textContent = meta.coverage_label || '结构化来源 + 地区 Web 发现';
    document.getElementById('footer').textContent = meta.footer || 'PhD Radar 仅汇总公开信息；申请前请再次核对官方页面。';

    const stats = [
      ['正式机会', summary.verified_opportunities ?? results.length, true],
      ['8.0 分以上', summary.score_8_plus ?? results.filter(x => Number(x.overall_match_raw ?? x.overall_match) >= 8).length],
      ['成功回源', summary.official_returns ?? results.length],
      ['待核验线索', summary.pending_leads ?? 0],
      ['覆盖地区', summary.regions ?? new Set(results.map(x => x.country).filter(Boolean)).size]
    ];
    document.getElementById('stats').innerHTML = stats.map(([label, value, accent]) => `<article class="stat ${accent ? 'accent' : ''}"><span class="value">${esc(value)}</span><span class="label">${esc(label)}</span></article>`).join('');

    const countries = [...new Set(results.map(x => x.country).filter(Boolean))].sort();
    document.getElementById('country').insertAdjacentHTML('beforeend', countries.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join(''));

    function action(url, label, primary = false) {
      const valid = safeUrl(url);
      return valid ? `<a class="action ${primary ? 'primary' : 'secondary'}" href="${esc(valid)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>` : `<span class="action secondary" aria-disabled="true">${esc(label)}暂无</span>`;
    }

    function card(item) {
      const deadlineStatus = fieldStatus(item, 'deadline');
      const fundingStatus = fieldStatus(item, 'funding');
      const chips = [item.country, item.city, item.opportunity_type, item.deadline ? `截止 ${item.deadline}` : '截止日期未知']
        .filter(Boolean).map(v => `<span class="chip">${esc(v)}</span>`).join('');
      const verified = `<span class="chip verified">官方页面已核验</span>`;
      const warnings = [deadlineStatus !== 'confirmed' ? '截止日期待核验' : '', fundingStatus !== 'confirmed' ? 'Funding 待核验' : '']
        .filter(Boolean).map(v => `<span class="chip warning">${esc(v)}</span>`).join('');
      const evidenceId = `evidence-${esc(item.opportunity_id)}`;
      const evidence = (item.field_evidence || []).map(e => `<dt>${esc(e.field)}</dt><dd><strong>${esc(e.status)}</strong> · ${esc(e.value ?? '未确定')} ${safeUrl(e.source_url) ? `· <a href="${esc(e.source_url)}" target="_blank" rel="noopener noreferrer">来源</a>` : ''}</dd>`).join('') || '<dt>证据</dt><dd>官方详情页已记录，暂无字段级摘要。</dd>';
      const institutionScreen = item.institution_screen || {};
      const qsOutcome = institutionScreen.outcome || 'manual_review';
      const qsLabels = {preferred:'学科优选', pass:'门槛通过', manual_review:'人工复核', excluded:'已排除'};
      const overallRank = institutionScreen.overall?.rank ?? institutionScreen.overall?.band ?? '未知';
      const subjectFacts = (institutionScreen.subjects || []).map(s => `<span class="screen-fact">${esc(s.name || '学科')} <strong>${esc(s.rank ?? s.band ?? '未知')}</strong></span>`).join('');
      const lab = item.lab_screen || {};
      const labStatus = lab.status || 'incomplete';
      const labLabels = {strong:'证据强', adequate:'证据充分', weak:'证据弱', incomplete:'待补充'};
      const labFacts = [['近年论文',lab.recent_research],['ERC / MSCA',lab.eu_funding],['博士产出',lab.doctoral_outputs],['外部合作',lab.external_collaboration]].map(([label,value]) => `<span class="screen-fact">${label} <strong>${esc(value || 'unknown')}</strong></span>`).join('');
      return `<article class="card" data-country="${esc(item.country)}" data-score="${esc(item.overall_match_raw ?? item.overall_match)}" data-search="${esc([item.title,item.institution,item.department,item.pi_or_contact,item.country,item.city].join(' ').toLowerCase())}">
        <div class="card-top">
          <div class="score"><div><strong>${score(item, 'overall_match')}</strong><span>综合推荐 / 10</span></div></div>
          <div><p class="rankline">推荐 #${esc(item.rank || '')}</p><h3>${esc(item.title || '未命名项目')}</h3><p class="institution">${esc(item.institution || '机构待核验')}${item.department ? ` · ${esc(item.department)}` : ''}</p></div>
        </div>
        <div class="chips">${verified}${chips}${warnings}</div>
        <div class="card-grid">
          <div><p class="recommendation">${esc(item.recommendation_reason || item.reason || '暂无推荐说明。')}</p></div>
          <aside class="pi-panel"><p class="pi-label">推荐 PI</p><p class="pi-name">${esc(item.pi_or_contact || '待确认')}</p><p class="pi-summary">${esc(item.pi_summary || '查看导师主页了解研究方向与近期项目。')}</p></aside>
        </div>
        <div class="screening">
          <section class="screen-panel"><div class="screen-title"><span>院校与学科门槛</span><span class="screen-state">${esc(qsLabels[qsOutcome] || qsOutcome)}</span></div><div class="screen-facts"><span class="screen-fact">QS 总榜 <strong>${esc(overallRank)}</strong></span>${subjectFacts}<span class="screen-fact">版本 <strong>${esc(institutionScreen.year || '待核验')}</strong></span></div></section>
          <section class="screen-panel"><div class="screen-title"><span>课题组深度核验</span><span class="screen-state">${esc(labLabels[labStatus] || labStatus)}</span></div><div class="screen-facts">${labFacts}</div></section>
        </div>
        <div class="actions">${action(item.official_application_url, 'Apply 主页', true)}${action(item.pi_profile_url, 'PI 介绍主页')}${action(item.official_detail_url, '项目官方页')}<button class="evidence-toggle" type="button" aria-expanded="false" aria-controls="${evidenceId}">查看证据</button></div>
        <div class="evidence" id="${evidenceId}"><dl>${evidence}</dl></div>
      </article>`;
    }

    const cards = document.getElementById('cards');
    const filters = ['query', 'country', 'min-score', 'qs-screen', 'lab-screen'];
    function render() {
      const q = document.getElementById('query').value.trim().toLowerCase();
      const country = document.getElementById('country').value;
      const min = Number(document.getElementById('min-score').value);
      const qsScreen = document.getElementById('qs-screen').value;
      const labScreen = document.getElementById('lab-screen').value;
      const visible = results.filter(item => (!q || [item.title,item.institution,item.department,item.pi_or_contact,item.country,item.city].join(' ').toLowerCase().includes(q)) && (!country || item.country === country) && Number(item.overall_match_raw ?? item.overall_match ?? 0) >= min && (!qsScreen || item.institution_screen?.outcome === qsScreen) && (!labScreen || item.lab_screen?.status === labScreen));
      cards.innerHTML = visible.length ? visible.map(card).join('') : '<div class="empty"><h3>没有符合当前筛选的项目</h3><p>调整地区、最低分、QS 或课题组筛选后再查看。</p></div>';
      document.getElementById('results-count').textContent = `显示 ${visible.length} / ${results.length}`;
      cards.querySelectorAll('.evidence-toggle').forEach(btn => btn.addEventListener('click', () => {
        const panel = document.getElementById(btn.getAttribute('aria-controls'));
        const open = panel.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(open));
        btn.textContent = open ? '收起证据' : '查看证据';
      }));
    }
    filters.forEach(id => document.getElementById(id).addEventListener(id === 'query' ? 'input' : 'change', render));
    document.getElementById('reset').addEventListener('click', () => { filters.forEach(id => document.getElementById(id).value = id === 'min-score' ? '0' : ''); render(); });
    render();
  </script>
</body>
</html>
